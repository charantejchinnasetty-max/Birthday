<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3d214d"><title>Happy Birthday, Maneesha 🎂</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600;700&family=Sacramento&display=swap" rel="stylesheet"><style>:root{--gold:#ffd991;--pink:#ff9fb8;--lav:#b795ff;--ink:#fffafc;--muted:rgba(255,250,252,.76);--ser:'Playfair Display',serif;--scr:'Sacramento',cursive;--sans:'DM Sans',sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:var(--sans);color:var(--ink);background:radial-gradient(circle at 20% 15%,rgba(255,151,187,.22),transparent 30%),radial-gradient(circle at 82% 76%,rgba(157,126,255,.24),transparent 31%),linear-gradient(145deg,#17102c,#321642 47%,#54234d);}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#stars{z-index:0} #fx{z-index:40}.scene{position:absolute;inset:0;z-index:2;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:clamp(20px,5vw,46px)}.scene.on{display:flex;animation:in .75s ease}@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}h1,h2,p{margin-top:0}h1,h2{font-family:var(--ser)}h1{font-size:clamp(2.5rem,9vw,5.8rem);line-height:1}h2{font-size:clamp(1.8rem,6vw,3.1rem);margin-bottom:10px}.script{font-family:var(--scr);font-weight:400;color:var(--gold)}.lead{font-size:clamp(1rem,2.8vw,1.12rem);line-height:1.7;color:var(--muted);max-width:680px;margin-inline:auto}.eyebrow{font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:600}.glass{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.17);backdrop-filter:blur(18px);border-radius:26px;box-shadow:0 26px 80px rgba(0,0,0,.28)}.btn{border:0;border-radius:999px;padding:14px 28px;margin-top:18px;cursor:pointer;font:600 .95rem var(--sans);color:#3e2430;background:linear-gradient(90deg,#ffe09e,#ffafc1);box-shadow:0 12px 35px rgba(255,151,185,.25)}.btn.ghost{color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);box-shadow:none}.progress{position:fixed;z-index:30;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:7px}.progress i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:.3s}.progress i.active{width:24px;border-radius:20px;background:var(--gold)}.music{position:fixed;z-index:50;right:14px;top:14px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(20,12,35,.55);color:#fff;display:none;cursor:pointer}.hero{width:min(92vw,530px);padding:38px 28px}.gift{font-size:64px;animation:float 2.8s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px) rotate(3deg)}}.name{font:400 clamp(4rem,15vw,7rem)/.9 var(--scr);color:var(--gold);margin:10px 0 16px}.treewrap{width:min(92vw,470px);padding:8px}#tree{width:100%;height:auto}.cl{animation:sw 4s ease-in-out infinite;transform-origin:center}@keyframes sw{50%{transform:translateY(-3px)}}.snow{position:fixed;top:-24px;z-index:8;pointer-events:none;color:#fff;text-shadow:0 0 8px #fff;animation:snowfall linear forwards}@keyframes snowfall{to{transform:translateY(112vh) translateX(35px) rotate(180deg);opacity:.25}}.cake{width:220px;margin:18px auto 6px;cursor:pointer;filter:drop-shadow(0 20px 24px rgba(0,0,0,.28))}.cake svg{width:100%;height:auto}.flame{transform-origin:110px 42px;animation:flicker .22s infinite alternate}@keyframes flicker{to{transform:rotate(4deg) scale(1.08)}}.memhead{max-width:760px;padding:0 20px}.marquee{width:100%;overflow:hidden;padding:24px 0 28px;mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}.track{display:flex;gap:18px;width:max-content;animation:scroll 30s linear infinite;padding-left:18px}.marquee:hover .track,.marquee:active .track{animation-play-state:paused}@keyframes scroll{to{transform:translateX(calc(-50% - 9px))}}.pol{width:210px;flex:0 0 210px;background:#fff8f2;color:#4b3743;padding:10px 10px 17px;border-radius:10px;box-shadow:0 18px 45px rgba(0,0,0,.3);transform:rotate(-1.5deg)}.pol:nth-child(even){transform:rotate(1.6deg)}.pol img{width:100%;height:235px;object-fit:cover;border-radius:5px;display:block}.
